version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # @astrojs/check@0.9.x peers typescript ^5 || ^6 only; major bumps break npm ci
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
